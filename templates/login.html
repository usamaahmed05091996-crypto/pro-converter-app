{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4 border-0 shadow-sm">
            <h3 class="text-center mb-4">
                <i class="fas {% if is_register %}fa-user-plus{% else %}fa-sign-in-alt{% endif %}"></i> 
                {{ "Create Account" if is_register else "Welcome Back" }}
            </h3>
            
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
                </div>

                {% if is_register %}
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                </div>
                {% endif %}

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
                    {{ "Sign Up Now" if is_register else "Login to Dashboard" }}
                </button>
            </form>

            <div class="mt-3 text-center">
                {% if is_register %}
                    <small>Already have an account? <a href="{{ url_for('login') }}">Login here</a></small>
                {% else %}
                    <small>Don't have an account? <a href="{{ url_for('register') }}">Register now</a></small>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
