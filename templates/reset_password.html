<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set New Password | Pro Converter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { width: 100%; max-width: 400px; padding: 2rem; border-radius: 15px; }
    </style>
</head>
<body>

    <div class="card shadow">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <h3 class="mb-4">Create New Password</h3>
            <p class="text-muted small">Enter your new secure password below.</p>
            
            <div class="mb-3">
                <input type="password" name="password" id="password" class="form-control" placeholder="New Password" required minlength="8">
            </div>
            
            <div class="mb-3">
                <input type="password" id="confirm_password" class="form-control" placeholder="Confirm Password" required onkeyup="checkPasswordMatch()">
                <div id="match-message" class="small mt-1"></div>
            </div>
            
            <button type="submit" id="submit-btn" class="btn btn-success w-100">Update Password</button>
        </form>
    </div>

    <script>
        function checkPasswordMatch() {
            const pass = document.getElementById('password').value;
            const conf = document.getElementById('confirm_password').value;
            const btn = document.getElementById('submit-btn');
            const msg = document.getElementById('match-message');

            if (pass === conf) {
                msg.textContent = "Passwords match!";
                msg.className = "text-success small mt-1";
                btn.disabled = false;
            } else {
                msg.textContent = "Passwords do not match!";
                msg.className = "text-danger small mt-1";
                btn.disabled = true;
            }
        }
    </script>
</body>
</html>
