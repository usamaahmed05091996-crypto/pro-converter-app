{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <h2 class="mb-4 text-center">File Conversion Dashboard</h2>

    <div class="row g-4 mb-5">
        <div class="col-md-3">
            <div class="card p-3 text-center h-100">
                <i class="fas fa-video fa-2x mb-2" style="color: #714B67;"></i>
                <h6>Video to Audio</h6>
                <form action="/convert" method="POST" enctype="multipart/form-data">
                    <input type="file" name="file" class="form-control form-control-sm mb-2" required>
                    <button type="submit" class="btn btn-primary btn-sm w-100">Convert</button>
                </form>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center h-100">
                <i class="fas fa-file-image fa-2x mb-2" style="color: #2c3e50;"></i>
                <h6>Image to PDF</h6>
                <form action="/convert-img-to-pdf" method="POST" enctype="multipart/form-data">
                    <input type="file" name="file" class="form-control form-control-sm mb-2" required>
                    <button type="submit" class="btn btn-primary btn-sm w-100">Convert</button>
                </form>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center h-100">
                <i class="fas fa-file-word fa-2x mb-2" style="color: #2b5797;"></i>
                <h6>PDF to Word</h6>
                <form action="/convert-pdf-to-word" method="POST" enctype="multipart/form-data">
                    <input type="file" name="file" class="form-control form-control-sm mb-2" required>
                    <button type="submit" class="btn btn-primary btn-sm w-100">Convert</button>
                </form>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center h-100">
                <i class="fas fa-file-excel fa-2x mb-2" style="color: #217346;"></i>
                <h6>PDF to Excel</h6>
                <form action="/convert-pdf-to-excel" method="POST" enctype="multipart/form-data">
                    <input type="file" name="file" class="form-control form-control-sm mb-2" required>
                    <button type="submit" class="btn btn-primary btn-sm w-100">Convert</button>
                </form>
            </div>
        </div>
    </div>

    <hr class="mb-5">
    <h4 class="mb-4 text-center">Advanced PDF Tools</h4>
    <div class="row g-4 justify-content-center">
        <div class="col-md-5">
            <div class="card p-3 h-100">
                <div class="text-center">
                    <i class="fas fa-object-group fa-2x mb-2" style="color: #6f42c1;"></i>
                    <h5>Merge Multiple PDFs</h5>
                </div>
                <form action="/merge-pdfs" method="POST" enctype="multipart/form-data">
                    <input type="file" name="files" class="form-control mb-2" multiple required>
                    <button type="submit" class="btn btn-secondary w-100">Merge Files</button>
                </form>
            </div>
        </div>
        <div class="col-md-5">
            <div class="card p-3 h-100">
                <div class="text-center">
                    <i class="fas fa-lock fa-2x mb-2" style="color: #dc3545;"></i>
                    <h5>Protect PDF with Password</h5>
                </div>
                <form action="/protect-pdf" method="POST" enctype="multipart/form-data">
                    <input type="file" name="file" class="form-control mb-2" required>
                    <input type="password" name="password" class="form-control mb-2" placeholder="Set Password" required>
                    <button type="submit" class="btn btn-danger w-100">Encrypt & Protect</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
