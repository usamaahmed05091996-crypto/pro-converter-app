<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password | Pro Converter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { width: 100%; max-width: 400px; padding: 2rem; border-radius: 15px; }
    </style>
</head>
<body>

    <div class="card shadow">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <h3 class="mb-4">Reset Password</h3>
            <p class="text-muted small">Enter your registered email address and we'll send you a link to reset your password.</p>
            
            <div class="mb-3">
                <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
            
            <div class="mt-3 text-center">
                <a href="/login" class="text-decoration-none">Back to Login</a>
            </div>
        </form>
    </div>

</body>
</html>
